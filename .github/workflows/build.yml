name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dm7-external-meter-windows-x64.exe
            built: dist/dm7-external-meter.exe
          - os: macos-latest        # Apple Silicon (arm64)
            asset: dm7-external-meter-macos-arm64
            built: dist/dm7-external-meter
          - os: macos-15-intel      # Intel (x86_64); macos-13 runners were retired
            asset: dm7-external-meter-macos-x64
            built: dist/dm7-external-meter
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r bridge/requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --clean --noconfirm packaging/dm7meter.spec
      - name: Smoke test (binary starts and serves the UI)
        shell: bash
        run: |
          "${{ matrix.built }}" --host 192.0.2.1 --listen 127.0.0.1 --port 8765 --no-browser &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/api/status > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/ | grep -q "DM7 External Meter"
          curl -sf http://127.0.0.1:8765/table.json | grep -q '"216"'
          kill $PID
      - name: Rename
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"
          if [ "${{ runner.os }}" != "Windows" ]; then chmod +x "out/${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
